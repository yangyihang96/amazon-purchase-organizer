<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Amazon Purchase Organizer</title>
<style>
:root{
  --page:#eef3f7; --frame:#fbfdff; --panel:#ffffff; --ink:#071225; --muted:#445064; --subtle:#6b7280; --line:#dce3ec;
  --blue:#0f5bd7; --blue-2:#2478ef; --blue-bg:#eaf3ff; --green:#08752f; --green-bg:#f1fbf2; --green-soft:#dcfce7;
  --yellow:#966600; --red:#b3261e; --red-bg:#fff0ef; --shadow:0 18px 44px rgba(15,35,70,.10);
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#fff 0,#f6f9fc 48%,var(--page) 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0}
.page{min-height:100vh;padding:14px 24px 30px;display:flex;flex-direction:column;align-items:center;gap:18px}
.report-frame{width:min(1536px,calc(100vw - 48px));aspect-ratio:3/2;background:var(--frame);border:1px solid var(--line);box-shadow:var(--shadow);padding:24px 52px 28px;display:grid;grid-template-rows:70px 146px 238px 1fr;gap:18px;overflow:hidden}
.report-hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:38px;text-align:center}
.hero-rule{height:2px;background:linear-gradient(90deg,transparent,var(--blue));position:relative}
.hero-rule.right{background:linear-gradient(90deg,var(--blue),transparent)}
.hero-rule::after{content:"";position:absolute;right:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--blue-2)}
.hero-rule.right::after{left:-6px;right:auto}
.frame-title{margin:0;font-size:58px;line-height:1;font-weight:850;white-space:nowrap;letter-spacing:0}
.metrics{display:grid;grid-template-columns:1.05fr .82fr .82fr 1.25fr;gap:16px}
.metric-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 26px rgba(20,35,60,.07);display:grid;grid-template-columns:92px 1fr;align-items:center;gap:18px;padding:22px 24px;min-width:0}
.metric-icon{width:88px;height:88px;border-radius:20px;background:linear-gradient(145deg,#eef6ff,#dbeafe);display:grid;place-items:center;color:var(--blue)}
.metric-icon svg{width:54px;height:54px}
.metric-label{font-size:21px;font-weight:800;margin-bottom:8px;color:#101828;white-space:nowrap}
.metric-value{font-size:31px;font-weight:850;color:var(--blue);line-height:1.08;white-space:normal}
.metric-date_range{grid-template-columns:76px 1fr;gap:14px}
.metric-date_range .metric-icon{width:72px;height:72px}
.metric-date_range .metric-icon svg{width:46px;height:46px}
.metric-date_range .metric-value{font-size:22px;line-height:1.12;white-space:nowrap}
.metric-date_range .metric-value{font-size:24px}
.prime-panel{border:1px solid #55bf6a;background:linear-gradient(90deg,#f9fff8,#f4fff4);border-radius:14px;padding:24px 32px;display:grid;grid-template-columns:178px 1fr 300px;gap:22px;align-items:center;box-shadow:0 10px 24px rgba(20,80,40,.06)}
.prime-shield-wrap{position:relative;width:166px;height:176px;display:grid;place-items:center}
.prime-shield{width:138px;height:158px;filter:drop-shadow(0 10px 14px rgba(0,80,30,.22))}
.prime-sparkle{position:absolute;color:#7fca98;font-weight:900;line-height:1}
.prime-sparkle.one{left:0;bottom:42px;font-size:32px}
.prime-sparkle.two{right:14px;top:8px;font-size:26px}
.prime-main{min-width:0}
.prime-title{font-size:31px;font-weight:850;color:var(--green);margin:0 0 20px}
.prime-metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;border-left:1px solid rgba(8,117,47,.22)}
.prime-metric{padding:0 10px;border-right:1px solid rgba(8,117,47,.22);min-width:0}
.prime-k{font-size:16px;font-weight:800;color:#111827;margin-bottom:10px;white-space:nowrap}
.prime-v{font-size:20px;font-weight:850;color:var(--green);white-space:nowrap}
.prime-note{font-size:18px;line-height:1.35;margin-top:22px;color:#111827}
.prime-note b{color:var(--green)}
.prime-result{border-left:1px solid rgba(8,117,47,.25);padding-left:26px}
.prime-result-title{font-size:23px;font-weight:850;margin-bottom:16px}
.prime-badge{height:92px;border:2px solid var(--green);border-radius:12px;background:#fbfffb;display:flex;align-items:center;justify-content:center;gap:14px;color:var(--green);font-size:25px;font-weight:850}
.prime-badge.red{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.prime-emoji{font-size:42px;line-height:1}
.content-grid{display:grid;grid-template-columns:1.02fr 1.12fr 1.05fr;gap:16px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 24px rgba(20,35,60,.06);padding:22px 24px;overflow:hidden;min-width:0}
.panel-title{display:flex;align-items:center;gap:12px;margin:0 0 18px;color:var(--blue);font-size:28px;line-height:1;font-weight:850}
.panel-title svg{width:32px;height:32px;color:var(--blue)}
.amount-list,.category-list,.month-list{display:grid;gap:12px}
.product-row{display:grid;grid-template-columns:34px 96px 1fr;gap:14px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:12px;min-width:0}
.product-row:last-child{border-bottom:0;padding-bottom:0}
.rank-num{width:32px;height:32px;border-radius:999px;background:var(--blue);color:#fff;font-size:20px;font-weight:850;display:grid;place-items:center}
.product-photo{width:92px;height:74px;object-fit:contain;border-radius:10px;background:var(--blue-bg);border:1px solid #dbeafe}
.product-title{font-size:18px;line-height:1.22;font-weight:750;color:#111827;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-amount{font-size:20px;font-weight:850;color:var(--blue)}
.product-category{font-size:16px;color:var(--muted);margin-top:2px}
.month-row{display:grid;grid-template-columns:74px 1fr 104px 130px;gap:12px;align-items:center;font-size:16px}
.monthly-bar-track{height:18px;background:#edf2f7;border-radius:5px;overflow:hidden}
.monthly-bar{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--blue-2));min-width:4px}
.month-amount{color:var(--blue);font-weight:750;white-space:nowrap;text-align:right}
.month-count{color:var(--muted);font-size:15px;white-space:nowrap;text-align:right}
.category-row{display:grid;grid-template-columns:58px 1fr auto;gap:18px;align-items:center;border-bottom:1px dashed var(--line);padding:10px 0}
.category-row:last-child{border-bottom:0}
.category-icon{width:58px;height:58px;border-radius:50%;background:var(--blue-bg);display:grid;place-items:center;color:var(--blue)}
.category-icon svg{width:34px;height:34px}
.category-name{font-size:20px;font-weight:800;color:#111827}
.category-amount{font-size:18px;font-weight:850;color:var(--blue);white-space:nowrap}
.details{width:min(1536px,calc(100vw - 48px));background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;box-shadow:0 10px 28px rgba(16,28,44,.08)}
.details summary{cursor:pointer;font-weight:800}
.details table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.details th,.details td{text-align:left;border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:top}
.details th{color:var(--muted);font-size:12px;text-transform:uppercase}
.details td{overflow-wrap:anywhere}
@media (max-width:980px){
  .page{padding:12px}
  .report-frame{width:100%;height:auto;aspect-ratio:auto;grid-template-rows:auto;gap:14px;padding:18px}
  .report-hero{grid-template-columns:1fr}.hero-rule{display:none}.frame-title{font-size:34px;white-space:normal}
  .metrics,.prime-panel,.content-grid{grid-template-columns:1fr}
  .metric-card{grid-template-columns:76px 1fr}.metric-icon{width:72px;height:72px}
  .prime-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prime-result{border-left:0;padding-left:0}
  .month-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"month amount" "bar bar" "count count";gap:6px 12px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .month-row:last-child{border-bottom:0;padding-bottom:0}
  .month-row>b{grid-area:month;min-width:0;overflow-wrap:anywhere}
  .monthly-bar-track{grid-area:bar;width:100%}
  .month-amount{grid-area:amount;text-align:right;min-width:max-content}
  .month-count{grid-area:count;white-space:normal;overflow-wrap:anywhere;text-align:left;line-height:1.35}
  .details{width:100%}
}
@media (max-width:560px){
  .page{padding:8px}
  .report-frame{gap:12px;padding:12px}
  .metrics{gap:10px}
  .metric-card{grid-template-columns:56px 1fr;gap:12px;padding:14px}
  .metric-icon{width:54px;height:54px;border-radius:14px}
  .metric-icon svg{width:36px;height:36px}
  .metric-label{font-size:16px;white-space:normal}
  .metric-value{font-size:24px;overflow-wrap:anywhere}
  .metric-date_range{grid-template-columns:56px 1fr}
  .metric-date_range .metric-icon{width:54px;height:54px}
  .metric-date_range .metric-icon svg{width:36px;height:36px}
  .metric-date_range .metric-value{font-size:18px;white-space:normal;overflow-wrap:anywhere}
  .prime-panel{padding:14px;gap:12px;align-items:stretch}
  .prime-shield-wrap{width:104px;height:94px;justify-self:center}
  .prime-shield{width:76px;height:88px}
  .prime-sparkle.one{left:6px;bottom:18px;font-size:20px}
  .prime-sparkle.two{right:8px;top:2px;font-size:18px}
  .prime-title{font-size:24px;margin-bottom:12px;text-align:center}
  .prime-metrics{grid-template-columns:1fr;gap:0;border-left:0}
  .prime-metric{display:grid;grid-template-columns:minmax(96px,42%) minmax(0,1fr);gap:10px;align-items:start;padding:9px 0;border-right:0;border-bottom:1px solid rgba(8,117,47,.18)}
  .prime-metric:last-child{border-bottom:0}
  .prime-k,.prime-v{white-space:normal;overflow-wrap:anywhere;word-break:break-word}
  .prime-k{font-size:14px;line-height:1.25;margin-bottom:0}
  .prime-v{font-size:18px;line-height:1.25}
  .prime-note{font-size:15px;line-height:1.45;margin-top:12px;overflow-wrap:anywhere}
  .prime-result-title{font-size:18px;margin-bottom:10px}
  .prime-badge{height:auto;min-height:62px;padding:10px 12px;gap:8px;flex-wrap:wrap;text-align:center;font-size:20px;line-height:1.2}
  .prime-emoji{font-size:32px}
  .panel{padding:16px}
  .panel-title{font-size:24px;line-height:1.15;gap:10px;margin-bottom:14px}
  .panel-title svg{width:28px;height:28px;flex:0 0 auto}
  .month-list{gap:10px}
  .month-row{font-size:15px}
  .monthly-bar-track{height:14px}
  .month-amount{font-size:16px;white-space:normal;overflow-wrap:anywhere}
  .month-count{font-size:14px}
  .details{padding:14px}
  .details table{display:block;overflow-x:auto;font-size:13px}
}
</style>
</head>
<body>
<main class="page">
  <section class="report-frame" id="report-frame" aria-live="polite"></section>
  <details class="details" id="details-panel">
    <summary id="details-title"></summary>
    <div id="details-body"></div>
  </details>
</main>
<script>
const DATA = __REPORT_DATA__;
const LABELS = DATA.labels || {};
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const attr = (v) => esc(v).replace(/`/g, '&#96;');
const label = (key, fallback) => LABELS[key] || fallback;
const lang = DATA.language === 'en' ? 'en' : 'zh';
document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';

function icon(name){
  const icons = {
    money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 6v12M15.5 8.5c-1.4-1-5-1.1-5.2 1.1-.2 2.7 5.8 1.6 5.3 5-.3 2.3-4.2 2.4-6.4.8"/></svg>',
    bag:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 8h12l1 12H5L6 8Zm3 0a3 3 0 0 1 6 0h-2a1 1 0 0 0-2 0H9Z"/></svg>',
    cube:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 3.8 6.6 12 11.2l8.2-4.6L12 2Zm-9 6.5v8.9L11 22v-8.9L3 8.5Zm10 13.5 8-4.6V8.5l-8 4.6V22Z"/></svg>',
    calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="M8 14h2M12 14h2M16 14h2M8 17h2M12 17h2"/></svg>',
    trophy:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h10v3h3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V18h3v2H8v-2h3v-3.1A5 5 0 0 1 8.3 11H8a4 4 0 0 1-4-4h3V4Zm10 5a2 2 0 0 0 2-2h-2v2ZM7 7H5a2 2 0 0 0 2 2V7Z"/></svg>',
    chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 18h16M5 15l5-5 4 3 5-7"/><path d="M18 6h2v2"/></svg>',
    pie:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 2v10h10A10 10 0 0 0 11 2Zm2 12V4.3A10 10 0 1 1 4.3 13H13Z"/></svg>'
  };
  return icons[name] || icons.cube;
}
function categoryIcon(categoryKey){
  const key = categoryKey || '';
  if (key.includes('Health')) return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 14h4l2-8 4 12 2-8h2"/></svg>';
  if (key.includes('Hobbies')) return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Zm0 2.3L6.2 8.5 12 11.7l5.8-3.2L12 5.3Z"/></svg>';
  if (key.includes('Office')) return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 20h16v2H4v-2Zm12.8-17 4.2 4.2L9.6 18.6 4.7 19.8l1.2-4.9L16.8 3Z"/></svg>';
  if (key.includes('Home')) return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 18h2v3h5v-8h3L12 4 3 13h3v8h5v-3Z"/></svg>';
  return icon('cube');
}
function metricCard(key, value, iconName){
  return `<article class="metric-card metric-${esc(key)}"><div class="metric-icon">${icon(iconName)}</div><div><div class="metric-label">${esc(label(key, key))}</div><div class="metric-value">${esc(value)}</div></div></article>`;
}
function parseAmount(value){
  const match = String(value || '').replace(/,/g,'').match(/-?\d+(?:\.\d+)?/);
  return match ? Number(match[0]) : 0;
}
function productRow(item, index){
  const title = item.display_title || item.title || label('untitled','Untitled');
  const image = item.product_image || '';
  return `<div class="product-row">
    <div class="rank-num">${index + 1}</div>
    <img class="product-photo" src="${attr(image)}" alt="${attr(item.product_image_alt || title)}">
    <div><div class="product-title">${esc(title)}</div><div class="product-amount">${esc(item.amount || '')}</div><div class="product-category">${esc(item.category || '')}</div></div>
  </div>`;
}
function monthRow(item, max){
  const amount = parseAmount(item.amount);
  const width = max > 0 ? Math.max(3, Math.round((amount / max) * 100)) : 3;
  const count = lang === 'en' ? `${item.order_count || 0} orders, ${item.item_count || 0} items` : `${item.order_count || 0} 个订单，${item.item_count || 0} 件物品`;
  return `<div class="month-row"><b>${esc(item.month || '')}</b><div class="monthly-bar-track"><div class="monthly-bar" style="width:${width}%"></div></div><div class="month-amount">${esc(item.amount || '')}</div><div class="month-count">${esc(count)}</div></div>`;
}
function categoryRow(item){
  return `<div class="category-row"><div class="category-icon">${categoryIcon(item.category_key)}</div><div class="category-name">${esc(item.category || '')}</div><div class="category-amount">${esc(item.amount || '')}</div></div>`;
}
function primeShield(){
  return `<div class="prime-shield-wrap"><span class="prime-sparkle one">✦</span><span class="prime-sparkle two">✦</span><svg class="prime-shield" viewBox="0 0 160 180" fill="none">
    <path d="M80 7 C102 20 125 29 141 35 L141 85 C141 128 115 159 80 175 C45 159 19 128 19 85 L19 35 C35 29 58 20 80 7Z" fill="url(#primeShieldGradient)" stroke="#08752f" stroke-width="2.5"/>
    <path d="M33 42 C51 35 66 29 80 20 C94 29 109 35 127 42 L127 82 C127 118 108 143 80 158 C52 143 33 118 33 82Z" fill="url(#primeShieldHighlight)" opacity=".42"/>
    <path class="prime-crown" d="M49 90 H111 V102 H49 V90ZM58 80 L47 52 L69 68 L80 40 L91 68 L113 52 L102 80 H58Z" fill="#fff"/>
    <rect x="53" y="100" width="54" height="7" rx="2" fill="#fff"/>
    <text class="prime-word" x="80" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#fff">Prime</text>
    <defs>
      <linearGradient id="primeShieldGradient" x1="30" y1="24" x2="122" y2="160"><stop stop-color="#4fce83"/><stop offset=".48" stop-color="#159a50"/><stop offset="1" stop-color="#047334"/></linearGradient>
      <linearGradient id="primeShieldHighlight" x1="44" y1="26" x2="102" y2="118"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    </defs>
  </svg></div>`;
}
function renderPrime(prime){
  const visual = prime.visual || {};
  const recovered = visual.tone === 'green';
  const badgeClass = recovered ? '' : ' red';
  const noteLabel = lang === 'en' ? 'Calculation' : '计算说明';
  return `<section class="prime-panel">
    ${primeShield()}
    <div class="prime-main">
      <h2 class="prime-title">${esc(label('prime_value','Prime Value'))}</h2>
      <div class="prime-metrics">
        ${primeMetric('year', prime.year)}
        ${primeMetric('membership_plan', prime.membership_plan_display || prime.membership_plan)}
        ${primeMetric('membership_cost', prime.membership_cost)}
        ${primeMetric('hypothetical_shipping', prime.hypothetical_non_member_shipping)}
        ${primeMetric('shipping_paid', prime.shipping_paid_identified)}
        ${primeMetric('net_value', prime.net_value)}
      </div>
      <div class="prime-note"><b>${esc(noteLabel)}：</b>${esc(prime.verdict || '')}</div>
    </div>
    <aside class="prime-result"><div class="prime-result-title">${esc(lang === 'en' ? 'Conclusion' : '结论')}</div><div class="prime-badge${badgeClass}"><span class="prime-emoji">${esc(visual.emoji || '😭')}</span><span>${esc(visual.label || '')}</span></div></aside>
  </section>`;
}
function primeMetric(key, value){
  return `<div class="prime-metric"><div class="prime-k">${esc(label(key,key))}</div><div class="prime-v">${esc(value || '')}</div></div>`;
}
function renderExactReport(){
  const s = DATA.summary || {};
  const p = DATA.prime_value || {};
  const top = (DATA.top_purchases || []).slice(0,3);
  const months = (DATA.monthly_totals || []).slice(0,5);
  const maxMonth = Math.max(0, ...months.map(item => parseAmount(item.amount)));
  const cats = (DATA.category_totals || []).slice(0,4);
  document.getElementById('report-frame').innerHTML = `
    <header class="report-hero"><div class="hero-rule"></div><h1 class="frame-title">${esc(label('report_title','Amazon Purchase Report'))}</h1><div class="hero-rule right"></div></header>
    <section class="metrics">
      ${metricCard('total_spend', s.total_spend || label('unrecognized','Unrecognized'), 'money')}
      ${metricCard('order_count', s.order_count ?? 0, 'bag')}
      ${metricCard('item_count', s.item_count ?? 0, 'cube')}
      ${metricCard('date_range', s.date_range || label('unrecognized','Unrecognized'), 'calendar')}
    </section>
    ${renderPrime(p)}
    <section class="content-grid">
      <section class="panel"><h2 class="panel-title">${icon('trophy')}${esc(label('amount_top','Amount Top'))}</h2><div class="amount-list">${top.map(productRow).join('') || esc(label('no_amount_data','No amount data'))}</div></section>
      <section class="panel"><h2 class="panel-title">${icon('chart')}${esc(label('monthly_ranking','Monthly Ranking'))}</h2><div class="month-list">${months.map(item => monthRow(item, maxMonth)).join('') || esc(label('no_monthly_data','No monthly data'))}</div></section>
      <section class="panel"><h2 class="panel-title">${icon('pie')}${esc(label('category_top','Category Top'))}</h2><div class="category-list">${cats.map(categoryRow).join('') || esc(label('no_category_data','No category data'))}</div></section>
    </section>`;
}
function renderDetails(){
  document.getElementById('details-title').textContent = label('order_details', 'Order Details');
  const rows = (DATA.orders || []).map(item => `<tr>
    <td><img class="product-photo" src="${attr(item.product_image || '')}" alt="${attr(item.product_image_alt || item.title || '')}"></td>
    <td>${esc(item.order_date || '')}</td><td>${esc(item.title || '')}</td><td>${esc(item.amount || '')}</td>
    <td>${esc(item.category || '')}</td><td>${esc(item.shipping_paid || '')}</td><td>${esc(item.status || '')}</td>
  </tr>`).join('');
  document.getElementById('details-body').innerHTML = `<table><thead><tr>
    <th>${esc(lang === 'en' ? 'Photo' : '图片')}</th><th>${esc(label('date', 'Date'))}</th><th>${esc(label('item', 'Item'))}</th><th>${esc(label('amount', 'Amount'))}</th>
    <th>${esc(label('category', 'Category'))}</th><th>${esc(label('shipping_paid_short', 'Paid Shipping'))}</th><th>${esc(label('status', 'Status'))}</th>
  </tr></thead><tbody>${rows || `<tr><td colspan="7">${esc(label('no_orders_data', 'No order data'))}</td></tr>`}</tbody></table>`;
}

renderDetails();
</script>
